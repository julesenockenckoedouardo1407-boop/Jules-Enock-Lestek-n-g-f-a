 name: Préparer les fichiers web
  run: |
    rm -rf www
    mkdir -p www/icons
    cp index.html manifest.webmanifest sw.js www/
    find . -name "icon-192.png" -exec cp {} www/icons/icon-192.png \;
    find . -name "icon-512.png" -exec cp {} www/icons/icon-512.png \;: Créer le projet Android Capacitor
        run: npx cap add android

      - name: Générer les icônes Android
        run: npx capacitor-assets generate --android

      - name: Synchroniser l'application
        run: npx cap sync android

      - name: Construire l'APK Debug
        working-directory: android
        run: ./gradlew
